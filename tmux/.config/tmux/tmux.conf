# ── Terminal ─────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set-option -g set-titles on
set-option -g set-titles-string "#S"
set -ag terminal-overrides ",xterm-256color:RGB"
set -ag terminal-overrides ",xterm-ghostty:RGB"

# Undercurl support (nvim diagnostics)
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# Extended keys (Shift+Enter, etc. for Claude Code)
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# ── General ──────────────────────────────────────────────────────
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g mouse on
set -g history-limit 50000
set -g set-clipboard on
set -s copy-command 'pbcopy'

# ── Neovim integration ──────────────────────────────────────────
set -sg escape-time 0
set -g focus-events on

# ── Notifications ────────────────────────────────────────────────
set -g allow-passthrough on
set -g monitor-bell on
set -g bell-action any
set -g visual-bell off

# ── Prefix ───────────────────────────────────────────────────────
# C-Space: hold a (ctrl via homerow mods) + tap space
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"
bind ? run-shell 'open ~/dotfiles/tmux/tmux-guide.html'

# ── Pane splitting ───────────────────────────────────────────────
bind '\' split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# ── Pane navigation (seamless with nvim) ─────────────────────────
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
  | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"

bind -n C-h if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind -n C-j if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind -n C-k if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind -n C-l if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-j select-pane -D
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-l select-pane -R

# ── Pane management ──────────────────────────────────────────────
bind x kill-pane

# ── Window management ────────────────────────────────────────────
bind c new-window -c "#{pane_current_path}"
bind X kill-window

# ── Session management ───────────────────────────────────────────
bind C command-prompt -p "New session:" "new-session -s '%%'"
bind Q confirm-before -p "Kill session #S? (y/n)" kill-session

# ── Direct window jump (Alt+number) ─────────────────────────────
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# ── No-prefix pane/window shortcuts ─────────────────────────────
bind -n M-t new-window -c "#{pane_current_path}"
bind -n M-z resize-pane -Z
bind -n M-\\ split-window -h -c "#{pane_current_path}"
bind -n M-- split-window -v -c "#{pane_current_path}"
bind -n M-x kill-pane

# ── Copy mode ────────────────────────────────────────────────────
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle

# ── Status bar (gruvbox-material) ────────────────────────────────
set -g status-position top
set -g status-style "bg=#282828,fg=#d4be98"
set -g status-left "#[fg=#282828,bg=#a9b665,bold] #S #[default] "
set -g status-left-length 20
set -g status-right "#[fg=#d4be98] %H:%M "
set -g status-right-length 20
setw -g window-status-format " #I:#W "
setw -g window-status-current-format "#[fg=#282828,bg=#d8a657,bold] #I:#W "
set -g pane-border-style "fg=#504945"
set -g pane-active-border-style "fg=#a9b665"
set -g message-style "bg=#504945,fg=#d4be98"

# ── Command palette (prefix + /) ────────────────────────────────
bind / display-menu -T "#[fg=#d8a657,bold] Tmux Help " -x C -y C \
  "" \
  "#[fg=#a9b665,bold]─── Panes ───"                        "" "" \
  "Split horizontal           \\"  "\\" "split-window -h -c '#{pane_current_path}'" \
  "Split vertical             -"  "-"  "split-window -v -c '#{pane_current_path}'" \
  "Close pane                 x"  "x"  "kill-pane" \
  "Zoom toggle                z"  "z"  "resize-pane -Z" \
  "Break to new window        !"  "!"  "break-pane" \
  "Swap up                    {"  "{"  "swap-pane -U" \
  "Swap down                  }"  "}"  "swap-pane -D" \
  "Sync panes (toggle)        y"  "y"  "setw synchronize-panes" \
  "" \
  "#[fg=#a9b665,bold]─── Windows ───"                      "" "" \
  "New window                 c"  "c"  "new-window -c '#{pane_current_path}'" \
  "Next window                n"  "n"  "next-window" \
  "Previous window            p"  "p"  "previous-window" \
  "Rename window              ,"  ","  "command-prompt -I '#W' 'rename-window \"%%\"'" \
  "Move window                ."  "."  "command-prompt 'move-window -t %%'" \
  "Close window               &"  "&"  "confirm-before -p 'Kill window? (y/n)' kill-window" \
  "" \
  "#[fg=#a9b665,bold]─── Sessions ───"                     "" "" \
  "New session                 C"  "C"  "command-prompt -p 'New session:' 'new-session -s %%'" \
  "List sessions              s"  "s"  "choose-tree -s" \
  "Detach                     d"  "d"  "detach-client" \
  "Rename session             \$"  "\$" "command-prompt -I '#S' 'rename-session \"%%\"'" \
  "Kill session                Q"  "Q"  "confirm-before -p 'Kill session #S? (y/n)' kill-session" \
  "Save session             C-s"  ""   "run-shell '~/.config/tmux/plugins/tmux-resurrect/scripts/save.sh'" \
  "Restore session          C-r"  ""   "run-shell '~/.config/tmux/plugins/tmux-resurrect/scripts/restore.sh'" \
  "" \
  "#[fg=#a9b665,bold]─── Copy Mode ───"                    "" "" \
  "Enter copy mode            ["  "["  "copy-mode" \
  "" \
  "#[fg=#a9b665,bold]─── Config ───"                       "" "" \
  "Reload config              r"  "r"  "source-file ~/.config/tmux/tmux.conf \; display 'Config reloaded'" \
  "" \
  "#[fg=#a9b665,bold]─── Navigation ───"                   "" "" \
  "C-h/j/k/l    Navigate panes (no prefix)"  "" "" \
  "M-1 to M-9   Jump to window (no prefix)"  "" "" \
  "" \
  "#[fg=#a9b665,bold]─── Reference ───"                    "" "" \
  "Open keybind guide         ?"  "?"  "run-shell 'open ~/dotfiles/tmux/tmux-guide.html'"

# ── Plugins (TPM) ───────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-capture-pane-contents 'on'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Auto-install TPM on first run
if "test ! -d ~/.config/tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm'"
run '~/.config/tmux/plugins/tpm/tpm'
