# ── Terminal ─────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -ag terminal-overrides ",xterm-ghostty:RGB"

# Undercurl support (nvim diagnostics)
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# ── General ──────────────────────────────────────────────────────
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g mouse on
set -g history-limit 50000
set -g set-clipboard on
set -s copy-command 'pbcopy'

# ── Neovim integration ──────────────────────────────────────────
set -sg escape-time 0
set -g focus-events on

# ── Prefix ───────────────────────────────────────────────────────
# C-a: hold a (ctrl via homerow mods) + tap a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ── Pane splitting ───────────────────────────────────────────────
bind '\' split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# ── Pane navigation (seamless with nvim) ─────────────────────────
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
  | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"

bind -n C-h if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind -n C-j if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind -n C-k if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind -n C-l if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-j select-pane -D
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-l select-pane -R

# ── Pane management ──────────────────────────────────────────────
bind x kill-pane

# ── Window management ────────────────────────────────────────────
bind c new-window -c "#{pane_current_path}"
bind X kill-window

# ── Copy mode ────────────────────────────────────────────────────
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle

# ── Status bar (gruvbox-material) ────────────────────────────────
set -g status-position top
set -g status-style "bg=#282828,fg=#d4be98"
set -g status-left "#[fg=#282828,bg=#a9b665,bold] #S #[default] "
set -g status-left-length 20
set -g status-right "#[fg=#d4be98] %H:%M "
set -g status-right-length 20
setw -g window-status-format " #I:#W "
setw -g window-status-current-format "#[fg=#282828,bg=#d8a657,bold] #I:#W "
set -g pane-border-style "fg=#504945"
set -g pane-active-border-style "fg=#a9b665"
set -g message-style "bg=#504945,fg=#d4be98"

# ── Command palette (prefix + /) ────────────────────────────────
bind / display-menu -T "#[fg=#d8a657,bold] Tmux Help " -x C -y C \
  "" \
  "#[fg=#a9b665,bold]─── Panes ───"                   "" "" \
  "Split horizontal        \\"  "\\" "split-window -h -c '#{pane_current_path}'" \
  "Split vertical          -"  "-" "split-window -v -c '#{pane_current_path}'" \
  "Close pane              x"  "x" "kill-pane" \
  "Zoom toggle             z"  "z" "resize-pane -Z" \
  "Swap up                 {"  "{" "swap-pane -U" \
  "Swap down               }"  "}" "swap-pane -D" \
  "" \
  "#[fg=#a9b665,bold]─── Windows ───"                  "" "" \
  "New window              c"  "c" "new-window -c '#{pane_current_path}'" \
  "Next window             n"  "n" "next-window" \
  "Previous window         p"  "p" "previous-window" \
  "Rename window           ,"  "," "command-prompt -I '#W' 'rename-window \"%%\"'" \
  "Close window            &"  "&" "confirm-before -p 'Kill window? (y/n)' kill-window" \
  "" \
  "#[fg=#a9b665,bold]─── Sessions ───"                 "" "" \
  "List sessions           s"  "s" "choose-tree -s" \
  "Detach                  d"  "d" "detach-client" \
  "Rename session          $"  "$" "command-prompt -I '#S' 'rename-session \"%%\"'" \
  "Save session          C-s"  "" "run-shell '~/.config/tmux/plugins/tmux-resurrect/scripts/save.sh'" \
  "Restore session       C-r"  "" "run-shell '~/.config/tmux/plugins/tmux-resurrect/scripts/restore.sh'" \
  "" \
  "#[fg=#a9b665,bold]─── Copy Mode ───"                "" "" \
  "Enter copy mode         ["  "[" "copy-mode" \
  "" \
  "#[fg=#a9b665,bold]─── Navigation ───"               "" "" \
  "C-h/j/k/l              Navigate panes (no prefix)"  "" "" \
  "prefix + 1-9           Jump to window"               "" ""

# ── Plugins (TPM) ───────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-capture-pane-contents 'on'

# Auto-install TPM on first run
if "test ! -d ~/.config/tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm'"
run '~/.config/tmux/plugins/tpm/tpm'
